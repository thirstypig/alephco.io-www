name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build /learn pages from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build:learn
      # Blog posts from Markdown, plus the blog index and the blog half of sitemap.xml.
      # Runs AFTER build:learn because both write sitemap.xml and this one must see the
      # /learn entries already in place — it rewrites only lines matching /blog/.
      #
      # ⚠️ A post dated in the future is BUILT but kept out of the sitemap until its date;
      # blog.html's auto-release script dims the card, but the page itself is live at its
      # URL, so the sitemap is the only thing actually holding it back from search.
      - name: Build blog posts from Markdown
        run: npm run build:blog
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: '.'
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v4
